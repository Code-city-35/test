<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест — Код города</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="assets/logo.png" alt="Код города" class="logo-img" style="height:50px; width:auto;">
            </div>
            <nav>
                <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
                <div class="nav-links" id="navLinks">
                    <a href="index.html">Главная</a>
                    <a href="catalog.html">Каталог</a>
                    <a href="blog.html">Блог</a>
                    <a href="rules.html">Правила</a>
                    <a href="profile.html">Профиль</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="quest-page">
            <div class="container">
                <div id="boxContent" class="terminal">
                    <!-- Загружается из box.js -->
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Код города · Череповец · 2026</p>
            <p class="footer-small">* Участие в квесте добровольное. Будьте внимательны на улицах.</p>
            <a href="privacy.html">Политика конфиденциальности</a>
        </div>
    </footer>

    <!-- Скрипты -->
    <script src="js/supabase-client.js"></script>
    <script src="js/quests-data.js"></script>
    <script type="module" src="js/box.js"></script>
    <script>
        // Бургер-меню
        const burger = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');
        burger.addEventListener('click', function() {
            this.classList.toggle('active');
            navLinks.classList.toggle('open');
        });
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navLinks.classList.remove('open');
            });
        });
    </script>
</body>
</html>
